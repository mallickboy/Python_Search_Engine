# ==========================================
# 1. VECTOR CACHE (150MB, allkeys-lru)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-vectors-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-vectors-service
spec:
  selector:
    app: redis-vectors
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-vectors
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-vectors
  template:
    metadata:
      labels:
        app: redis-vectors
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        command: 
          - "redis-server"
          - "--maxmemory"
          - "150mb"
          - "--maxmemory-policy"
          - "allkeys-lru"
          - "--appendonly"
          - "yes"
        ports:
          - containerPort: 6379
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-vectors-pvc

---
